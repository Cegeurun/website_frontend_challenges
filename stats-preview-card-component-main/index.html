<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | Stats preview card component</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

<body>

  <div id="main-content">

    <div id="purple-overlay">
      <div id="content-picture">
      <picture>
        <source media="(min-width:1440px)" srcset="./images/image-header-desktop.jpg">
        <img src="./images/image-header-mobile.jpg" id="content-picture-mobile">
      </picture>
      </div>
    </div>


    <div id="content-text">
      <p class="text-header">Get <span style="color:hsl(277, 64%, 61%)">insights</span> that help your business grow.</p>

      <p class="text-content">Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>

      <h6 class="text-header">10K+</h6><h6 class="text-content">companies</h6>
      <h6 class="text-header">314</h6><h6 class="text-content">templates</h6>
      <h6 class="text-header">12M+</h6><h6 class="text-content">queries</h6>
